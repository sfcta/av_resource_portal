project:
  type: website
  render: 
    - "*.qmd"
    - "!data_dashboard/dashboard.qmd"

website:
  title: "AV Resource Portal"
  bread-crumbs: true
  page-navigation: true
  navbar:
    title: false
    logo: "resources/SFCTA Logo dark-background.png"
    logo-href: "https://www.sfcta.org/"
    pinned: true
    background: "#006c69"
    left:
      - text: "Data Dashboard"
        href: data_dashboard/introduction.qmd
      - text: "Learn More"
        href: "https://www.sfcta.org/policies/av#panel-overview"
  sidebar:
    - title: "Data Dashboard"
      contents: 
      - text: "Introduction"
        href: data_dashboard/introduction.qmd
      - text: "Vehicles and People"
        href: data_dashboard/vehicles_and_people.qmd
      - text: "Safety"
        href: data_dashboard/safety.qmd
      - text: "Transparency"
        href: data_dashboard/transparency.qmd

format:
  html:
    toc: false
    theme:
      - cosmo
      - brand
    css: ./dstyles.css
    callout-appearance: minimal
    lightbox: true
    




